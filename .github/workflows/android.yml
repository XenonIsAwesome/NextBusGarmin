# Tests and builds the Android companion app: a release APK (sideload / GitHub release) and an
# Android App Bundle (what Google Play takes). Runs on Android changes, manually, and from release.yml.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", "tools/gtfs-index/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", "tools/gtfs-index/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version name or tag, e.g. 1.2.3 or v1.2.3
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      # The bundled stop index is not committed. Use the one the nightly "Publish stop index" job
      # released; if there is none yet, build it from the Ministry GTFS (about a minute).
      - name: Bundle the stop index
        working-directory: .
        run: |
          out=android/app/src/main/assets
          mkdir -p "$out"
          if gh release download index-latest --pattern index.db.gz --dir "$RUNNER_TEMP"; then
            gunzip -c "$RUNNER_TEMP/index.db.gz" > "$out/index.db"
          else
            echo "No published index yet, building it."
            python3 tools/gtfs-index/build_index.py --out "$out/index.db"
          fi
          ls -l "$out/index.db"

      - name: Protocol drift check
        working-directory: .
        run: protocol/check.sh

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Optional release signing (Settings > Secrets and variables > Actions):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the build is signed with the debug key: installable, but not uploadable to Play.
      - name: Prepare signing
        id: signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "NEXTBUS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "NEXTBUS_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "NEXTBUS_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "NEXTBUS_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK and bundle
        run: |
          args="-PversionCode=${{ github.run_number }}"
          v="${{ inputs.version }}"; v="${v#v}"   # release.yml passes the tag, e.g. v1.2.3
          if [ -n "$v" ]; then args="$args -PversionName=$v"; fi
          ./gradlew assembleRelease bundleRelease --no-daemon $args
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/nextbus.apk
          cp app/build/outputs/bundle/release/*.aab ../out/nextbus.aab
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: nextbus-android-${{ steps.signing.outputs.real == 'true' && 'signed' || 'debug-signed' }}
          path: out/*
          if-no-files-found: error
