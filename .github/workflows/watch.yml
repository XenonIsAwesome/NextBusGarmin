# Builds the Connect IQ watch app: one .prg per device (sideloading) and an .iq (Connect IQ Store).
# Runs on watch changes, manually, and as part of release.yml.
name: Watch app

on:
  push:
    branches: [main]
    paths: ["watch/**", "protocol/**", ".github/workflows/watch.yml"]
  pull_request:
    paths: ["watch/**", "protocol/**", ".github/workflows/watch.yml"]
  workflow_dispatch:
  workflow_call:

env:
  CIQ_SDK_VERSION: "9.2.0"
  CIQ_SDK_MANAGER_VERSION: "v0.8.4"   # lindell/connect-iq-sdk-manager-cli

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Connect IQ SDK and device files cannot be redistributed, so they are fetched on every run
      # with Garmin's own download service through the community CLI.
      # Required repository settings (Settings > Secrets and variables > Actions):
      #   secrets.GARMIN_USERNAME / secrets.GARMIN_PASSWORD  - a Garmin account used to download
      #   vars.CIQ_AGREEMENT_HASH  - hash of the Connect IQ SDK license agreement you accepted
      #                              (`connect-iq-sdk-manager agreement view` prints it)
      # Optional: secrets.GARMIN_DEVELOPER_KEY_BASE64 - your real developer key (base64 of the DER file).
      - name: Install Connect IQ SDK manager CLI
        run: |
          curl -sfL "https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/${CIQ_SDK_MANAGER_VERSION}/install.sh" \
            | sh -s -- -b "$HOME/.local/bin" "${CIQ_SDK_MANAGER_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install SDK and devices
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          CIQ_AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}
        run: |
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ] || [ -z "$CIQ_AGREEMENT_HASH" ]; then
            echo "::error::Set secrets GARMIN_USERNAME, GARMIN_PASSWORD and variable CIQ_AGREEMENT_HASH (see comments in this workflow)."
            exit 1
          fi
          connect-iq-sdk-manager agreement accept --agreement-hash="$CIQ_AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CIQ_SDK_VERSION"
          connect-iq-sdk-manager device download --manifest=manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Prepare signing key
        id: key
        env:
          KEY_B64: ${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/developer_key"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
            # Throwaway key: fine for sideloading, not valid for the Connect IQ store.
            openssl genrsa -out "$RUNNER_TEMP/key.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/developer_key" -nocrypt
          fi

      # The repo keeps FAKE_PHONE = true so a developer build runs on built-in demo data. Every CI
      # build talks to the real phone app, so switch it off here and prove it before compiling.
      - name: Disable the demo phone
        run: |
          sed -i 's/const FAKE_PHONE = true;/const FAKE_PHONE = false;/' source/Config.mc
          grep -q 'const FAKE_PHONE = false;' source/Config.mc
          grep -q 'const FAKE_SCENARIO_TAG = false;' source/Config.mc

      - name: Build all devices
        run: |
          mkdir -p out
          for d in fr165 fr165m fr255 fr255m fr255s fr255sm; do
            monkeyc -d "$d" -f monkey.jungle -o "out/nextbus-$d.prg" -y "$RUNNER_TEMP/developer_key" -w -r
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: nextbus-watch-prg
          path: watch/out/*.prg
          if-no-files-found: error

      # Store package (.iq, every product in manifest.xml). Only with the real developer key: store
      # updates must be signed with the same key as the first upload.
      - name: Export Connect IQ Store package
        if: steps.key.outputs.real == 'true'
        run: monkeyc -e -f monkey.jungle -o out/nextbus.iq -y "$RUNNER_TEMP/developer_key" -w -r

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.real == 'true'
        with:
          name: nextbus-watch-iq
          path: watch/out/nextbus.iq
          if-no-files-found: error
